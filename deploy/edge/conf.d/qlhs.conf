# qlhs.pmh.com.vn — QLHS. Edge terminate TLS rồi proxy HTTP thuần sang qlhs-web:80.
# Giống qlts.conf; thêm /events/ (SSE realtime của QLHS) tắt buffering + timeout dài.

server {
  # Cả cụm dùng cổng công khai 8443. Redirect_uri QLHS đăng ký ở PMH ID mang :8443.
  listen 8443 ssl;
  http2 on;
  server_name qlhs.pmh.com.vn;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;

  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 25m;   # cho upload hồ sơ

  set $qlhs http://qlhs-web:80;

  # SSE realtime — KHÔNG buffer, timeout dài (giữ kết nối sự kiện)
  location /events/ {
    proxy_pass $qlhs;
    proxy_http_version 1.1;
    proxy_set_header Host              qlhs.pmh.com.vn;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass $qlhs;
    proxy_http_version 1.1;
    proxy_set_header Host              qlhs.pmh.com.vn;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
}
