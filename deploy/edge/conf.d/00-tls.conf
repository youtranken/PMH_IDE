# TLS hardening DÙNG CHUNG cho MỌI vhost edge (L2). File này KHÔNG có server{} —
# chỉ chứa directive http-context nên áp cho id.conf, qlts.conf và mọi vhost thêm
# sau. Nạp trước (tiền tố 00-) để chắc chắn có hiệu lực trước các server block.
#
# Cấu hình Mozilla "intermediate" (2024): bỏ TLS 1.0/1.1/SSLv3, chỉ AEAD cipher
# forward-secret. Mọi client hiện đại (trình duyệt ≥2018, openid-client, jose)
# đều hỗ trợ — không gãy tích hợp.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# Tái dùng phiên TLS (giảm handshake) — an toàn, không dùng session ticket khóa cũ.
ssl_session_timeout 1d;
ssl_session_cache shared:EdgeTLS:10m;
ssl_session_tickets off;
