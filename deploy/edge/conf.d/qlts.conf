# qlts.pmh.com.vn — QLTS. Edge terminate TLS rồi proxy HTTP thuần sang qlts-web:80.
# QUAN TRỌNG: gửi X-Forwarded-Proto https để cookie Secure / một-origin của QLTS
# không gãy (qlts-web:80 tự nó là $scheme=http). qlts-web forward tiếp xuống api.

server {
  # Cả cụm dùng cổng công khai 8443 (edge chỉ publish 8443). Nghe 443 = KHÔNG
  # ai tới được nữa. Redirect_uri QLTS đăng ký ở PMH ID cũng phải mang :8443.
  listen 8443 ssl;
  http2 on;
  server_name qlts.pmh.com.vn;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # Khớp trần upload QLTS (biên bản 20MB + overhead multipart)
  client_max_body_size 21m;

  set $qlts http://qlts-web:80;

  location / {
    proxy_pass $qlts;
    proxy_http_version 1.1;
    proxy_set_header Host              qlts.pmh.com.vn;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
}
