# id.pmh.com.vn — PMH ID (vhost mặc định). Bê từ deploy/nginx/default.conf.template
# nhưng: listen 443 cố định (không envsubst), cert wildcard, +HSTS, dùng biến+resolver
# cho proxy_pass (nginx -t validate được khi backend chưa lên; runtime tự re-resolve).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# HTTP :80 → ép HTTPS (mọi host chưa có vhost :80 riêng). Cổng công khai là 8443
# nên redirect phải mang :8443 (nếu không trình duyệt nhảy về 443 mặc định = sai cổng).
server {
  listen 80 default_server;
  server_name _;
  return 301 https://$host:8443$request_uri;
}

# HTTPS :8443 — PMH ID (default_server: host lạ cũng về đây). PHẢI nghe đúng 8443
# (không phải 443) để app nội bộ resolve alias admin-de.pmh.com.vn:8443 gọi tới được
# — publish 8443:8443, KHÔNG 8443:443.
server {
  listen 8443 ssl default_server;
  http2 on;
  server_name de-admin.pmh.com.vn admin-de.pmh.com.vn;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # HSTS gom về edge (backend không còn làm TLS). includeSubDomains phủ mọi
  # *.pmh.com.vn (đều qua edge, đều HTTPS). preload BỎ QUA có chủ đích — khóa
  # cứng toàn subdomain + phải submit hstspreload.org (quyết định vận hành).
  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;

  # Docker DNS để re-resolve backend theo biến (tránh 502 vĩnh viễn khi recreate)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # SANITIZE X-Forwarded-* (AD-4). $http_host giữ nguyên (khớp issuer OIDC).
  proxy_http_version 1.1;
  proxy_set_header Host              $http_host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;

  set $sso http://sso-server:3000;
  set $fe  http://portal-fe:5173;

  # BE: OIDC provider + API → sso-server. (KHÔNG proxy /docs về BE nữa: cổng tài
  # liệu giờ là trang SPA — /docs phải rơi về portal-fe để SPA fallback render;
  # dữ liệu docs đọc qua /api/docs/:clientId đã nằm trong `location /api/`.)
  location /oidc/        { proxy_pass $sso; }
  location /api/         { proxy_pass $sso; }

  # /interaction/:uid → SPA render trang login
  location /interaction/ { proxy_pass $fe; }

  # FE: còn lại → portal SPA
  location / { proxy_pass $fe; }
}
