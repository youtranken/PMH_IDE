# EDGE — cổng vào DUY NHẤT cho mọi project (Model B). Terminate TLS bằng cert
# wildcard *.pmh.com.vn, route theo hostname sang backend chạy HTTP thuần.
# Chỉ service này publish 80/8443 ra host. Vòng đời độc lập với pmhid/qlts.
#
#   docker network create --subnet 172.20.0.0/16 --gateway 172.20.0.1 edge
#   (1 lần; PIN subnet cố định để WEBHOOK_ALLOWLIST_CIDR không vỡ khi tạo lại mạng)
#   docker compose -f deploy/edge/docker-compose.yml up -d
name: pmh-edge

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 256m  # phần của edge trong ngân sách 16GB cụm PMH_IDE
    environment:
      TZ: Asia/Bangkok
    ports:
      - "80:80"
      # Cổng công khai PMH ID = 8443. Map 8443:8443 (KHÔNG 8443:443) để lời gọi
      # nội bộ container→container tới admin-de.pmh.com.vn:8443 cũng trúng nginx.
      - "8443:8443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      # Nhà cert CHUNG duy nhất (gen-certs.sh sinh vào đây; prod đặt cert thật vào đây).
      # KHÔNG copy riêng cho edge → gia hạn cert 1 chỗ, không lệch.
      - ../nginx/certs:/etc/nginx/certs:ro
    networks:
      edge:
        # Alias để container nội bộ (vd qlts-api gọi token-exchange) resolve
        # id.pmh.com.vn / qlts.pmh.com.vn về chính nginx này — đi trong máy,
        # không ra internet, issuer giữ URL công khai.
        aliases:
          # de-* = tên mới (BCL/webhook nội bộ resolve về edge). Giữ tên CŨ để
          # cấu hình cũ chưa migrate không vỡ khi resolve nội bộ (gỡ khi mọi
          # client đã chuyển hẳn sang de-*:8443).
          - de-admin.pmh.com.vn
          - de-qlts.pmh.com.vn
          - de-qlhs.pmh.com.vn
          - admin-de.pmh.com.vn
          - qlts.pmh.com.vn

networks:
  edge:
    external: true
