# PMH ID — hạ tầng dev. `docker compose -f deploy/docker-compose.yml up --build`
# Cổng host lấy từ ../.env (né project khác đang chiếm 8080/8443).
# EDGE (deploy/edge) là cổng vào 80/443 chung; stack này KHÔNG còn nginx riêng.
name: pmh-id

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 768m # trần RAM (tổng stack ~2.5G, dưới ngân sách 3G máy dev)
    mem_reservation: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Bangkok # giờ VN (UTC+7) — đồng bộ log/hiển thị; timestamptz vẫn lưu UTC
      PGTZ: Asia/Bangkok
    ports:
      - "${HOST_PG_PORT:-5490}:5432" # chỉ dev; prod bỏ dòng này. PMH ID quy định host = 5490
    networks: [pmhid-internal]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    mem_limit: 128m
    environment:
      TZ: Asia/Bangkok
    ports:
      - "${HOST_MAILPIT_UI_PORT:-8026}:8025" # UI xem mail dev
      - "${HOST_MAILPIT_SMTP_PORT:-1026}:1025" # SMTP app gửi vào
    networks: [pmhid-internal]

  sso-server:
    build:
      context: ..
      dockerfile: apps/sso-server/Dockerfile
    restart: unless-stopped
    mem_limit: 1024m # Node + oidc-provider (khoản lớn nhất của stack)
    mem_reservation: 384m
    env_file: ../.env
    environment:
      PORT: "3000"
      TZ: Asia/Bangkok # Node Date/log theo giờ VN
      PGTZ: Asia/Bangkok
      # host DB trong network compose là tên service `postgres`
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # Mạng: edge (EDGE nginx proxy tới sso-server:3000; và sso-server resolve
    # qlts.pmh.com.vn qua alias EDGE cho webhook/BCL) + pmhid-internal (postgres/mailpit).
    networks: [edge, pmhid-internal]
    volumes:
      - signing_keys:/run/secrets/signing-keys
      - audit_archive:/archive
      # KHÔNG mount backups vào sso-server: RCE app không được chạm kho backup
      # (chỉ service `backup` có quyền ghi/đọc).
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      # /api/health trả 503 khi DB down → liveness thật cho lõi auth (AD-16).
      # Dùng node có sẵn (alpine không có curl); exit!=0 khi status!=200.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s

  portal-fe:
    build:
      context: ..
      dockerfile: apps/portal-fe/Dockerfile
    restart: unless-stopped
    mem_limit: 512m # Vite dev server (prod tĩnh nginx dùng ít hơn nhiều)
    mem_reservation: 128m
    environment:
      # EDGE chạy 443 → HMR websocket client nối cổng 443 (dev hot-reload).
      VITE_PUBLIC_HTTPS_PORT: "443"
      TZ: Asia/Bangkok
    networks: [edge]
    expose:
      - "5173"

  # Backup trọn bộ (E3-S1) — KHÔNG chạy thường; gọi qua:
  #   docker compose --profile backup run --rm backup
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    profiles: ["backup"]
    env_file: ../.env
    environment:
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SIGNING_KEYS_DIR: /run/secrets/signing-keys
      ENV_FILE: /secrets/.env
      BACKUP_OUT: /backups
    networks: [pmhid-internal]
    volumes:
      - ../.env:/secrets/.env:ro
      - signing_keys:/run/secrets/signing-keys:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # Cổng-vào chung (tạo ngoài: `docker network create --subnet 172.20.0.0/16 --gateway 172.20.0.1 edge`
  # — PIN subnet để webhook allowlist ổn định). sso-server & portal-fe join.
  edge:
    external: true
  # Nội bộ PMH ID: postgres/mailpit/backup — EDGE và project khác KHÔNG thấy.
  pmhid-internal:

volumes:
  pg_data:
  signing_keys:
  audit_archive:
  backups:
