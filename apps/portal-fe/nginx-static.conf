# Phục vụ portal-fe đã build tĩnh (prod). Nginx chính vẫn proxy `/` vào cổng
# 5173 của container này — cấu hình nginx chính không đổi so với dev.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tài nguyên có hash trong tên → cache dài, bất biến.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA (routing phía client): path không khớp file → trả index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html không cache để deploy mới được nhận ngay.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
